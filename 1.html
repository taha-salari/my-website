<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب | login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;

        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #6c63ff55, transparent 35%),
                radial-gradient(circle at bottom right, #00d4ff44, transparent 35%),
                #0b1020;
            color: white;

        }


        .login_card {
            position: relative;
            width: 23.44vw;
            height: 69.19vh;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            border: 2px double rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            top: -20px;
            gap: 20px;
        }


        .circ {
            position: relative;
            height: 7vh;
            width: 3.5vw;
            border-radius: 24px;
            background: linear-gradient(#6c63ff, #00d4ff);
            font-size: 35px;
            text-align: center;
            margin-top: 40px;
            border: 2px solid #6c63ff;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .fg {
            position: absolute;
            right: 5;
        }

        .inp {
            width: 15.625vw;
            height: 4.63vh;
            background-color: rgba(255, 255, 255, 0.07);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            outline: none;
            color: white;

        }


        .b {
            width: 15.625vw;
            height: 4.63vh;
            background: linear-gradient(#6c63ff, #00bfff);
            border-radius: 15px;
            border: 2px solid;
            transition: 1s;

        }

        .a:hover {
            background-color: white;
        }

        .b:hover {

            box-shadow: 0 10px 30px #6c63ff55;
            transform: scale(1.03);
        }
        @media (max-width:1221px){
            .login_card{
                width: 65vw;
                height: 70vh;
            
            }
            .circ{
                height: 8vh;
                width: 4.5vw;

            }
            .inp{

                width: 30vw;
                height: 5.5vh;
            }
            .b{
                
                width: 40vw;
                height: 5.5vh;
            }

            }
            @media (max-height:700px){

            }
    </style>
</head>

<body dir="rtl">
    <div class="container">
        <div class="login_card">
            <div class="circ">A</div>
            <h1> خوش آمدید 👋</h1>
            <p>برای ورود اطلاعات خود را وارد کنید</p>

            <form action="./2.html">
                <div class="fg">
                    <label>نام کاربری </label>
                </div><br><br>
                <input type="text" placeholder="نام خود را وارد کنید" class="inp" required>
                <div class="fg"><br>
                    <label>رمز حساب</label>
                </div> <br><br><br><br>
                <input type="password" placeholder="رمز خود را وارد کنید " class="inp" required><br>
                <a href="">رمز را فراموش کرده‌اید؟</a><br><br><br>
                <button class="b">login</button>

            </form>
        </div>
    </div>

</body>

</html>
